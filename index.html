<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Kathleen McGinn Art — Original paintings by Kathleen McGinn" />
  <title>Kathleen McGinn Art</title>

  <!-- Preload critical assets -->
  <link rel="preload" href="./assets/portrait.jpg" as="image" />
  <link rel="preload" href="./assets/logo.png" as="image" />

  <!-- Fonts: Cormorant Garamond for editorial elegance -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>

  <!-- =============================================
       GALLERY BACKGROUND ATMOSPHERE
  ============================================== -->
  <div class="gallery-bg" aria-hidden="true">
    <div class="gallery-vignette"></div>
    <div class="gallery-spotlight"></div>
  </div>

  <!-- =============================================
       MAIN HERO STAGE
  ============================================== -->
  <main class="hero-stage" role="main">

    <!-- Easel Assembly -->
    <div class="easel-assembly" aria-hidden="true">

      <!-- Easel Structure: SVG-based refined metal easel -->
      <div class="easel-frame">
        <svg
          class="easel-svg"
          viewBox="0 0 400 540"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
          aria-hidden="true"
        >
          <!-- Left leg -->
          <line
            class="easel-leg easel-leg-left"
            x1="200" y1="80"
            x2="60" y2="520"
            stroke="#8a7a6a"
            stroke-width="2.5"
            stroke-linecap="round"
          />
          <!-- Right leg -->
          <line
            class="easel-leg easel-leg-right"
            x1="200" y1="80"
            x2="340" y2="520"
            stroke="#8a7a6a"
            stroke-width="2.5"
            stroke-linecap="round"
          />
          <!-- Back support leg -->
          <line
            class="easel-leg easel-leg-back"
            x1="200" y1="90"
            x2="200" y2="520"
            stroke="#6b5d50"
            stroke-width="2"
            stroke-linecap="round"
            stroke-dasharray="none"
          />
          <!-- Cross brace -->
          <line
            class="easel-brace"
            x1="105" y1="380"
            x2="295" y2="380"
            stroke="#8a7a6a"
            stroke-width="2"
            stroke-linecap="round"
          />
          <!-- Upper ledge rail (where canvas sits) -->
          <line
            class="easel-ledge"
            x1="118" y1="130"
            x2="282" y2="130"
            stroke="#8a7a6a"
            stroke-width="3"
            stroke-linecap="round"
          />
          <!-- Top crossbar -->
          <line
            class="easel-topbar"
            x1="140" y1="88"
            x2="260" y2="88"
            stroke="#8a7a6a"
            stroke-width="2.5"
            stroke-linecap="round"
          />
          <!-- Apex pin -->
          <circle
            class="easel-apex"
            cx="200" cy="80"
            r="4"
            fill="#8a7a6a"
          />
          <!-- Ledge end caps -->
          <circle class="easel-ledge-cap" cx="118" cy="130" r="3" fill="#8a7a6a" />
          <circle class="easel-ledge-cap" cx="282" cy="130" r="3" fill="#8a7a6a" />
          <!-- Foot caps -->
          <circle class="easel-foot" cx="60" cy="520" r="4" fill="#6b5d50" />
          <circle class="easel-foot" cx="340" cy="520" r="4" fill="#6b5d50" />
          <circle class="easel-foot" cx="200" cy="520" r="3" fill="#6b5d50" />
        </svg>
      </div>

      <!-- Canvas / Painting Reveal -->
      <div class="canvas-wrapper" role="img" aria-label="Portrait painting by Kathleen McGinn">
        <div class="canvas-mat">
          <div class="canvas-inner">
            <div class="canvas-reveal-mask">
              <img
                class="painting-image"
                src="./assets/portrait.jpg"
                alt="Portrait painting by Kathleen McGinn"
                draggable="false"
              />
            </div>
          </div>
          <!-- Subtle canvas edge shadow -->
          <div class="canvas-shadow" aria-hidden="true"></div>
        </div>
      </div>

    </div>
    <!-- /easel-assembly -->

    <!-- =============================================
         SIGNATURE / LOGO REVEAL
    ============================================== -->
    <div class="signature-wrapper" role="img" aria-label="Kathleen McGinn Art signature">
      <img
        class="signature-logo"
        src="./assets/logo.png"
        alt="Kathleen McGinn Art"
        draggable="false"
      />
    </div>

    <!-- Optional minimal tagline — remove if signature alone is preferred -->
    <!-- <p class="hero-tagline">Original Works</p> -->

  </main>

  <!-- =============================================
       SCRIPTS: GSAP via CDN
  ============================================== -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="./js/main.js"></script>
</body>
</html>
