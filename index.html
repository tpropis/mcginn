<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Kathleen McGinn Art — Original paintings by Kathleen McGinn" />
  <title>Kathleen McGinn Art</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>

  <!-- Gallery background atmosphere -->
  <div class="gallery-bg" aria-hidden="true">
    <div class="gallery-vignette"></div>
    <div class="gallery-spotlight"></div>
  </div>

  <!-- Main hero -->
  <main class="hero-stage">

    <!-- Easel + canvas unit -->
    <div class="easel-assembly">

      <!--
        EASEL SVG
        Shape: classic A-frame artist easel
        - Two front legs spread from apex (top center)
        - One vertical center post straight down (the cross vertical)
        - One horizontal ledge bar where canvas rests (the cross horizontal)
        - Lower brace between legs
        viewBox: 0 0 400 560
        Apex: 200, 48
      -->
      <svg
        class="easel-svg"
        viewBox="0 0 400 560"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
        aria-hidden="true"
      >
        <!-- ── Apex hinge pin ── -->
        <circle id="e-apex" cx="200" cy="48" r="5" fill="#9a8b7a" />

        <!-- ── Top crossbar ── -->
        <line id="e-topbar"
          x1="152" y1="56" x2="248" y2="56"
          stroke="#9a8b7a" stroke-width="3" stroke-linecap="round" />

        <!-- ── LEFT front leg: apex → bottom left ── -->
        <line id="e-leg-l"
          x1="200" y1="48" x2="52" y2="540"
          stroke="#9a8b7a" stroke-width="2.8" stroke-linecap="round" />

        <!-- ── RIGHT front leg: apex → bottom right ── -->
        <line id="e-leg-r"
          x1="200" y1="48" x2="348" y2="540"
          stroke="#9a8b7a" stroke-width="2.8" stroke-linecap="round" />

        <!-- ── CENTER BACK POST: straight down (the VERTICAL of the cross) ── -->
        <line id="e-post"
          x1="200" y1="48" x2="200" y2="540"
          stroke="#7a6b5c" stroke-width="2.2" stroke-linecap="round" />

        <!-- ── LEDGE RAIL: horizontal where canvas rests (the HORIZONTAL of the cross) ── -->
        <line id="e-ledge"
          x1="112" y1="118" x2="288" y2="118"
          stroke="#9a8b7a" stroke-width="4" stroke-linecap="round" />

        <!-- ── Ledge end caps ── -->
        <circle id="e-cap-l" cx="112" cy="118" r="4" fill="#9a8b7a" />
        <circle id="e-cap-r" cx="288" cy="118" r="4" fill="#9a8b7a" />

        <!-- ── Lower brace between front legs ── -->
        <line id="e-brace"
          x1="108" y1="400" x2="292" y2="400"
          stroke="#9a8b7a" stroke-width="2.2" stroke-linecap="round" />

        <!-- ── Foot caps ── -->
        <circle id="e-foot-l"  cx="52"  cy="540" r="5" fill="#7a6b5c" />
        <circle id="e-foot-r"  cx="348" cy="540" r="5" fill="#7a6b5c" />
        <circle id="e-foot-c"  cx="200" cy="540" r="4" fill="#7a6b5c" />
      </svg>

      <!-- Canvas / painting (sits on the ledge) -->
      <div class="canvas-wrapper" role="img" aria-label="Portrait painting by Kathleen McGinn">
        <div class="canvas-mat">
          <div class="canvas-inner">
            <!-- Reveal mask — JS animates clip-path -->
            <div class="canvas-reveal-mask">
              <img
                class="painting-image"
                src="./assets/portrait.jpg"
                alt="Portrait painting by Kathleen McGinn"
                draggable="false"
              />
            </div>
          </div>
          <div class="canvas-edge" aria-hidden="true"></div>
        </div>
      </div>

    </div>
    <!-- /easel-assembly -->

    <!-- Signature logo -->
    <div class="signature-wrapper" role="img" aria-label="Kathleen McGinn Art">
      <img
        class="signature-logo"
        src="./assets/signature.png"
        alt="Kathleen McGinn Art"
        draggable="false"
      />
    </div>

  </main>

  <!-- GSAP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="./js/main.js"></script>
</body>
</html>
